services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-web3_wallet}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    restart: unless-stopped
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--chain-id", "31337", "--block-time", "1"]
    ports:
      - "${ANVIL_PORT:-8545}:8545"
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      anvil:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev,docker}
      MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-web3_wallet}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WEB3_RPC_URL: http://anvil:8545
      WEB3_CHAIN_ID: 31337
      JWT_SECRET: ${JWT_SECRET:-docker-development-secret-key-change-before-use}
      WALLET_SIGNER_LOCAL_PRIVATE_KEY: ${WALLET_SIGNER_LOCAL_PRIVATE_KEY:-ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      WALLET_SIGNER_HOT_WALLET_ADDRESS: ${WALLET_SIGNER_HOT_WALLET_ADDRESS:-0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266}
      WALLET_SIGNER_KEY_ID: ${WALLET_SIGNER_KEY_ID:-anvil-dev}
      WALLET_SCAN_ENABLED: ${WALLET_SCAN_ENABLED:-false}
      WALLET_CUSTODY_ENABLED: ${WALLET_CUSTODY_ENABLED:-false}
      WALLET_RECONCILIATION_ENABLED: ${WALLET_RECONCILIATION_ENABLED:-false}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

volumes:
  mysql_data:
  redis_data:
