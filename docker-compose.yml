services:
  mysql:
    image: mysql:8.0
    container_name: web3-wallet-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: web3_wallet
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7
    container_name: web3-wallet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mysql_data:
