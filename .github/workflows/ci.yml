name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  signer-service-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: signer-service/pom.xml
      - name: Test isolated signer service
        working-directory: signer-service
        run: mvn --batch-mode --no-transfer-progress clean test

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        command: --log-bin-trust-function-creators=1
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wallet
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      CI: true
      EVM_RPC_URL: http://127.0.0.1:8545
      EVM_CHAIN_ID: 31337
      EVM_ERC20_ARTIFACT: /tmp/forge-out/TestToken.sol/TestToken.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn --version

      - name: Docker available
        run: |
          docker version
          docker info

      - name: Verify MySQL and Redis services
        run: |
          docker exec "${{ job.services.mysql.id }}" mysqladmin ping -h 127.0.0.1 -proot
          docker exec "${{ job.services.redis.id }}" redis-cli ping

      - name: Start Anvil and compile the test ERC-20
        run: |
          install -d -m 0777 /tmp/forge-out
          docker run --detach --name anvil-ci \
            --entrypoint anvil \
            --publish 8545:8545 \
            ghcr.io/foundry-rs/foundry:latest \
            --host 0.0.0.0 --chain-id 31337 --block-time 1
          docker run --rm \
            --entrypoint forge \
            --volume "${{ github.workspace }}:/workspace:ro" \
            --volume "/tmp/forge-out:/forge-out" \
            --workdir /workspace \
            ghcr.io/foundry-rs/foundry:latest \
            build \
            --root /workspace/src/test/evm \
            --out /forge-out \
            --cache-path /forge-out/cache
          test -r "$EVM_ERC20_ARTIFACT"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              --header 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
              "$EVM_RPC_URL" | grep --quiet '0x7a69'; then
              exit 0
            fi
            sleep 1
          done
          docker logs anvil-ci
          exit 1

      - name: Build
        id: tests
        continue-on-error: true
        run: mvn --batch-mode --no-transfer-progress clean test

      - name: Unit Tests
        id: unit_tests
        if: always()
        continue-on-error: true
        run: >-
          python3 scripts/ci_test_summary.py
          --reports target/surefire-reports
          --required-only
          --require com.example.wallet.infrastructure.security.JwtTokenProviderTest#shouldCreateAndParseToken

      - name: Service Tests
        id: service_tests
        if: always()
        continue-on-error: true
        run: >-
          python3 scripts/ci_test_summary.py
          --reports target/surefire-reports
          --required-only
          --require com.example.wallet.module.asset.service.impl.AssetServiceImplTest#shouldCreditDepositAndPreserveBalanceInvariant

      - name: Flyway Migration Tests
        id: flyway_tests
        if: always()
        continue-on-error: true
        run: >-
          python3 scripts/ci_test_summary.py
          --reports target/surefire-reports
          --required-only
          --require com.example.wallet.migration.FlywayMySqlMigrationTest#shouldMigrateEmptyDatabaseFromV1ToLatest

      - name: MySQL Integration Tests
        id: mysql_tests
        if: always()
        continue-on-error: true
        run: >-
          python3 scripts/ci_test_summary.py
          --reports target/surefire-reports
          --required-only
          --require com.example.wallet.Web3WalletApplicationIntegrationTest#shouldCreateOnlyOneNativeAssetAccountUnderConcurrentCredits

      - name: Redis Tests
        id: redis_tests
        if: always()
        continue-on-error: true
        run: >-
          python3 scripts/ci_test_summary.py
          --reports target/surefire-reports
          --required-only
          --require com.example.wallet.Web3WalletApplicationIntegrationTest#shouldReadAndWriteRedis

      - name: Blockchain Integration Tests
        id: blockchain_tests
        if: always()
        continue-on-error: true
        run: >-
          python3 scripts/ci_test_summary.py
          --reports target/surefire-reports
          --required-only
          --require com.example.wallet.infrastructure.web3.AnvilBlockchainIntegrationTest#shouldTransferEthAndReachConfirmations
          --require com.example.wallet.infrastructure.web3.AnvilBlockchainIntegrationTest#shouldDeployAndTransferErc20
          --require com.example.wallet.WalletBusinessE2EIntegrationTest#shouldCreditEthDepositExactlyOnce
          --require com.example.wallet.WalletBusinessE2EIntegrationTest#shouldCreditErc20DepositExactlyOnce
          --require com.example.wallet.WalletBusinessE2EIntegrationTest#shouldCompleteEthWithdrawalEndToEnd
          --require com.example.wallet.WalletBusinessE2EIntegrationTest#shouldCompleteErc20WithdrawalEndToEnd
          --require com.example.wallet.WalletBusinessE2EIntegrationTest#shouldSerializeConcurrentWithdrawalsAndRecoverStaleOutbox
          --require com.example.wallet.WalletBusinessE2EIntegrationTest#shouldPauseWithdrawalsWhenReconciliationFindsAnomaly
          --require com.example.wallet.WalletBusinessE2EIntegrationTest#shouldFreezeConfirmedDepositRemovedByChainReorganization

      - name: Test Results
        id: report
        if: always()
        continue-on-error: true
        run: >-
          python3 scripts/ci_test_summary.py
          --reports target/surefire-reports
          --fail-on-skipped
          --write-summary

      - name: Upload Surefire reports
        if: >-
          always() &&
          (steps.tests.outcome != 'success' ||
           steps.unit_tests.outcome != 'success' ||
           steps.service_tests.outcome != 'success' ||
           steps.flyway_tests.outcome != 'success' ||
           steps.mysql_tests.outcome != 'success' ||
           steps.redis_tests.outcome != 'success' ||
           steps.blockchain_tests.outcome != 'success' ||
           steps.report.outcome != 'success')
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: warn
          retention-days: 14

      - name: Show Anvil logs on failure
        if: >-
          always() &&
          (steps.tests.outcome != 'success' || steps.blockchain_tests.outcome != 'success')
        run: docker logs anvil-ci

      - name: Enforce CI result
        if: always()
        env:
          BUILD_RESULT: ${{ steps.tests.outcome }}
          UNIT_RESULT: ${{ steps.unit_tests.outcome }}
          SERVICE_RESULT: ${{ steps.service_tests.outcome }}
          FLYWAY_RESULT: ${{ steps.flyway_tests.outcome }}
          MYSQL_RESULT: ${{ steps.mysql_tests.outcome }}
          REDIS_RESULT: ${{ steps.redis_tests.outcome }}
          BLOCKCHAIN_RESULT: ${{ steps.blockchain_tests.outcome }}
          REPORT_RESULT: ${{ steps.report.outcome }}
        run: |
          failed_checks=()
          check_result() {
            local check_name="$1"
            local check_result="$2"
            printf '%-30s %s\n' "$check_name" "$check_result"
            if [ "$check_result" != "success" ]; then
              failed_checks+=("$check_name ($check_result)")
            fi
          }

          check_result "Build" "$BUILD_RESULT"
          check_result "Unit Tests" "$UNIT_RESULT"
          check_result "Service Tests" "$SERVICE_RESULT"
          check_result "Flyway Migration Tests" "$FLYWAY_RESULT"
          check_result "MySQL Integration Tests" "$MYSQL_RESULT"
          check_result "Redis Tests" "$REDIS_RESULT"
          check_result "Blockchain Integration Tests" "$BLOCKCHAIN_RESULT"
          check_result "Test Results" "$REPORT_RESULT"

          if [ "${#failed_checks[@]}" -ne 0 ]; then
            {
              echo "### Required CI checks failed"
              for failed_check in "${failed_checks[@]}"; do
                echo "- $failed_check"
              done
              echo
              echo "Expand the named step above and inspect its first error."
            } >> "$GITHUB_STEP_SUMMARY"
            printf 'Required CI check failed: %s\n' "${failed_checks[@]}" >&2
            exit 1
          fi

          echo "### All required CI checks passed" >> "$GITHUB_STEP_SUMMARY"

  container-security:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable candidate image
        run: docker build --tag wallet:${{ github.sha }} .
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: wallet:${{ github.sha }}
          artifact-name: wallet-${{ github.sha }}.spdx.json
      - name: Generate Trivy security report
        # v0.36.0, pinned to the verified immutable release commit.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: wallet:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
      - name: Upload security report
        if: hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
      - name: Enforce image vulnerability gate
        # Keep the blocking scan in table format so package names, installed
        # versions and fixed versions are visible directly in the job log.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: wallet:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  solidity-protocol-test:
    name: Solidity fuzz and invariant tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: staking-protocol
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Formatting
        run: forge fmt --check
      - name: Unit, fuzz and invariant tests
        run: forge test -vv
      - name: Coverage report
        run: forge coverage --report summary

  solidity-static-analysis:
    name: Slither static analysis
    runs-on: ubuntu-latest
    needs: solidity-protocol-test
    defaults:
      run:
        working-directory: staking-protocol
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Slither
        run: pip install slither-analyzer
      - name: Generate complete Slither report
        run: >-
          slither .
          --compile-force-framework foundry
          --filter-paths "test|src/mocks"
          --exclude-dependencies
          --fail-none
          --json slither-report.json
      - name: Enforce untriaged Slither findings
        run: >-
          slither .
          --compile-force-framework foundry
          --filter-paths "test|src/mocks"
          --exclude-dependencies
          --exclude
          reentrancy-balance,divide-before-multiply,incorrect-equality,reentrancy-no-eth,reentrancy-benign,timestamp,low-level-calls
      - name: Upload Slither report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-report
          path: staking-protocol/slither-report.json
          if-no-files-found: warn

  staking-dapp-build:
    name: Staking dApp production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: staking-protocol/frontend
    env:
      VITE_CHAIN_ID: 11155111
      VITE_CHAIN_NAME: Sepolia
      VITE_RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
      VITE_EXPLORER_URL: https://sepolia.etherscan.io
      VITE_VAULT_ADDRESS: 0x0000000000000000000000000000000000000001
      VITE_STAKING_TOKEN_ADDRESS: 0x0000000000000000000000000000000000000002
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: staking-protocol/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: staking-dapp-dist
          path: staking-protocol/frontend/dist
