server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: web3-wallet-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/web3_wallet?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root123456}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

jwt:
  secret: ${JWT_SECRET:please-change-this-secret-key-to-at-least-32-bytes}
  expiration: ${JWT_EXPIRATION:86400000}

web3:
  rpc-url: ${WEB3_RPC_URL:https://sepolia.infura.io/v3/your-key}
  chain-id: ${WEB3_CHAIN_ID:11155111}
  connect-timeout: ${WEB3_CONNECT_TIMEOUT:5000}
  read-timeout: ${WEB3_READ_TIMEOUT:15000}
  write-timeout: ${WEB3_WRITE_TIMEOUT:10000}
  call-timeout: ${WEB3_CALL_TIMEOUT:30000}
  max-retries: ${WEB3_MAX_RETRIES:2}
  retry-backoff: ${WEB3_RETRY_BACKOFF:500}
  retry-max-backoff: ${WEB3_RETRY_MAX_BACKOFF:5000}
  max-requests-per-second: ${WEB3_MAX_REQUESTS_PER_SECOND:10}
  eth-transfer-gas-limit: ${WEB3_ETH_TRANSFER_GAS_LIMIT:21000}
  erc20-transfer-gas-limit: ${WEB3_ERC20_TRANSFER_GAS_LIMIT:100000}

wallet:
  confirm-blocks: ${WALLET_CONFIRM_BLOCKS:12}
  operations:
    deposit-enabled: ${WALLET_DEPOSIT_ENABLED:true}
    withdraw-enabled: ${WALLET_WITHDRAW_ENABLED:true}
  api-rate-limit:
    enabled: ${WALLET_API_RATE_LIMIT_ENABLED:true}
    login-limit: ${WALLET_LOGIN_RATE_LIMIT:10}
    api-limit: ${WALLET_API_RATE_LIMIT:120}
    window-seconds: ${WALLET_API_RATE_LIMIT_WINDOW_SECONDS:60}
    fail-open: ${WALLET_API_RATE_LIMIT_FAIL_OPEN:false}
  signer:
    hot-wallet-address: ${WALLET_SIGNER_HOT_WALLET_ADDRESS:}
    key-id: ${WALLET_SIGNER_KEY_ID:withdraw-v1}
    local-private-key: ${WALLET_SIGNER_LOCAL_PRIVATE_KEY:}
    remote-url: ${WALLET_SIGNER_REMOTE_URL:}
    remote-path: ${WALLET_SIGNER_REMOTE_PATH:/api/v1/sign/ethereum-transaction}
    remote-health-path: ${WALLET_SIGNER_REMOTE_HEALTH_PATH:/actuator/health/readiness}
    remote-connect-timeout: ${WALLET_SIGNER_REMOTE_CONNECT_TIMEOUT:3s}
    remote-read-timeout: ${WALLET_SIGNER_REMOTE_READ_TIMEOUT:10s}
    remote-api-token: ${WALLET_SIGNER_REMOTE_API_TOKEN:}
    client-key-store: ${WALLET_SIGNER_CLIENT_KEY_STORE:}
    client-key-store-password: ${WALLET_SIGNER_CLIENT_KEY_STORE_PASSWORD:}
    trust-store: ${WALLET_SIGNER_TRUST_STORE:}
    trust-store-password: ${WALLET_SIGNER_TRUST_STORE_PASSWORD:}
  withdraw-broadcast:
    enabled: ${WALLET_WITHDRAW_BROADCAST_ENABLED:true}
    fixed-delay: ${WALLET_WITHDRAW_BROADCAST_FIXED_DELAY:5000}
    batch-size: ${WALLET_WITHDRAW_BROADCAST_BATCH_SIZE:20}
    max-attempts: ${WALLET_WITHDRAW_BROADCAST_MAX_ATTEMPTS:5}
    retry-delay: ${WALLET_WITHDRAW_BROADCAST_RETRY_DELAY:30000}
    processing-timeout: ${WALLET_WITHDRAW_BROADCAST_PROCESSING_TIMEOUT:120000}
  withdraw-chain:
    enabled: ${WALLET_WITHDRAW_RECEIPT_ENABLED:true}
    gas-safety-multiplier: ${WALLET_WITHDRAW_GAS_SAFETY_MULTIPLIER:1.20}
    max-gas-limit: ${WALLET_WITHDRAW_MAX_GAS_LIMIT:300000}
    max-total-fee-wei: ${WALLET_WITHDRAW_MAX_TOTAL_FEE_WEI:20000000000000000}
    pending-timeout: ${WALLET_WITHDRAW_PENDING_TIMEOUT:1800000}
    receipt-fixed-delay: ${WALLET_WITHDRAW_RECEIPT_FIXED_DELAY:15000}
    receipt-batch-size: ${WALLET_WITHDRAW_RECEIPT_BATCH_SIZE:50}
    replacement-lookback-blocks: ${WALLET_WITHDRAW_REPLACEMENT_LOOKBACK_BLOCKS:128}
  reconciliation:
    enabled: ${WALLET_RECONCILIATION_ENABLED:false}
    fixed-delay: ${WALLET_RECONCILIATION_FIXED_DELAY:3600000}
    lock-lease: ${WALLET_RECONCILIATION_LOCK_LEASE:600000}
    lock-key: ${WALLET_RECONCILIATION_LOCK_KEY:wallet:reconciliation:lock}
    asset-addresses: ${WALLET_RECONCILIATION_ASSET_ADDRESSES:}
  monitoring:
    enabled: ${WALLET_MONITORING_ENABLED:true}
    fixed-delay: ${WALLET_MONITORING_FIXED_DELAY:30000}
  signature:
    challenge-ttl: ${WALLET_SIGNATURE_CHALLENGE_TTL:300000}
  custody:
    enabled: ${WALLET_CUSTODY_ENABLED:false}
    chain: ${WALLET_CUSTODY_CHAIN:ETH_SEPOLIA}
    active-key-version: ${WALLET_CUSTODY_KEY_VERSION:v1}
    remote-url: ${WALLET_CUSTODY_REMOTE_URL:}
    remote-api-token: ${WALLET_CUSTODY_REMOTE_API_TOKEN:}
    keys:
      - version: ${WALLET_CUSTODY_KEY_VERSION:v1}
        mnemonic: ${WALLET_CUSTODY_MNEMONIC:}
        passphrase: ${WALLET_CUSTODY_PASSPHRASE:}
        account: ${WALLET_CUSTODY_ACCOUNT:0}
    sweep:
      enabled: ${WALLET_CUSTODY_SWEEP_ENABLED:false}
      collection-address: ${WALLET_CUSTODY_COLLECTION_ADDRESS:}
      fixed-delay: ${WALLET_CUSTODY_SWEEP_FIXED_DELAY:15000}
      lock-lease: ${WALLET_CUSTODY_SWEEP_LOCK_LEASE:60000}
      lock-key: ${WALLET_CUSTODY_SWEEP_LOCK_KEY:wallet:custody-sweep:lock}
      batch-size: ${WALLET_CUSTODY_SWEEP_BATCH_SIZE:20}
      max-attempts: ${WALLET_CUSTODY_SWEEP_MAX_ATTEMPTS:5}
      retry-delay: ${WALLET_CUSTODY_SWEEP_RETRY_DELAY:60000}
      processing-timeout: ${WALLET_CUSTODY_SWEEP_PROCESSING_TIMEOUT:300000}
      minimum-eth-amount: ${WALLET_CUSTODY_MINIMUM_ETH_SWEEP:0.0001}
      eth-reserve: ${WALLET_CUSTODY_ETH_RESERVE:0}
  scan:
    enabled: ${WALLET_SCAN_ENABLED:false}
    chain: ${WALLET_SCAN_CHAIN:ETH_SEPOLIA}
    initial-block: ${WALLET_SCAN_INITIAL_BLOCK:0}
    batch-size: ${WALLET_SCAN_BATCH_SIZE:100}
    reorg-depth: ${WALLET_SCAN_REORG_DEPTH:24}
    fixed-delay: ${WALLET_SCAN_FIXED_DELAY:15000}
    lock-key-prefix: ${WALLET_SCAN_LOCK_KEY_PREFIX:wallet:deposit-scan:lock:}
    lock-lease: ${WALLET_SCAN_LOCK_LEASE:300000}
    tokens: []

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
