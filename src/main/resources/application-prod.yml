spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: ${MYSQL_POOL_MAX_SIZE:20}
      minimum-idle: ${MYSQL_POOL_MIN_IDLE:5}
      connection-timeout: ${MYSQL_CONNECTION_TIMEOUT:30000}
  flyway:
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

jwt:
  secret: ${JWT_SECRET}

web3:
  rpc-url: ${WEB3_RPC_URL}
  secondary-rpc-url: ${WEB3_SECONDARY_RPC_URL}
  block-hash-quorum-enabled: ${WEB3_BLOCK_HASH_QUORUM_ENABLED:true}
  rpc-quorum-max-head-lag: ${WEB3_RPC_QUORUM_MAX_HEAD_LAG:2}
  rpc-quorum-preflight-fixed-delay: ${WEB3_RPC_QUORUM_PREFLIGHT_FIXED_DELAY:30000}
  chain-id: ${WEB3_CHAIN_ID}

wallet:
  operations:
    deposit-enabled: ${WALLET_DEPOSIT_ENABLED:false}
    withdraw-enabled: ${WALLET_WITHDRAW_ENABLED:false}
  signer:
    hot-wallet-address: ${WALLET_SIGNER_HOT_WALLET_ADDRESS}
    key-id: ${WALLET_SIGNER_KEY_ID}
    remote-url: ${WALLET_SIGNER_REMOTE_URL}
    remote-api-token: ${WALLET_SIGNER_REMOTE_API_TOKEN}
    client-key-store: ${WALLET_SIGNER_CLIENT_KEY_STORE}
    client-key-store-password: ${WALLET_SIGNER_CLIENT_KEY_STORE_PASSWORD}
    trust-store: ${WALLET_SIGNER_TRUST_STORE}
    trust-store-password: ${WALLET_SIGNER_TRUST_STORE_PASSWORD}
  scan:
    enabled: ${WALLET_SCAN_ENABLED:false}
  custody:
    enabled: ${WALLET_CUSTODY_ENABLED:false}
    remote-url: ${WALLET_CUSTODY_REMOTE_URL:}
    remote-api-token: ${WALLET_CUSTODY_REMOTE_API_TOKEN:}
    sweep:
      enabled: ${WALLET_CUSTODY_SWEEP_ENABLED:false}
  withdraw-broadcast:
    enabled: ${WALLET_WITHDRAW_BROADCAST_ENABLED:false}
  withdraw-chain:
    enabled: ${WALLET_WITHDRAW_RECEIPT_ENABLED:false}
  reconciliation:
    enabled: ${WALLET_RECONCILIATION_ENABLED:false}

management:
  endpoint:
    health:
      show-details: never
      group:
        readiness:
          include: readinessState,db,redis,remoteSigner,rpcQuorum

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
