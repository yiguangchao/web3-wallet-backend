groups:
  - name: wallet-critical
    rules:
      - alert: WalletApplicationDown
        expr: up{job="web3-wallet-backend"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: Wallet backend is unavailable
          runbook_url: docs/runbooks/incident-response.md#application-down
      - alert: WalletLedgerAnomaly
        expr: wallet_ledger_anomalies > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: Internal ledger invariant violation detected
          runbook_url: docs/runbooks/incident-response.md#ledger-or-reconciliation-difference
      - alert: WalletReconciliationDifference
        expr: wallet_reconciliation_differences > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: Wallet reconciliation has open differences
          runbook_url: docs/runbooks/incident-response.md#ledger-or-reconciliation-difference
      - alert: WalletOutboxBacklog
        expr: wallet_outbox_backlog > 20
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: Withdrawal broadcast outbox is accumulating
          runbook_url: docs/runbooks/incident-response.md#outbox-backlog
      - alert: WalletPendingWithdrawals
        expr: wallet_withdraw_pending > 20
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: Pending withdrawals exceed the operational threshold
      - alert: WalletNonceGap
        expr: wallet_nonce_gap > 3
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: Hot-wallet nonce gap is unsafe
          runbook_url: docs/runbooks/incident-response.md#nonce-anomaly
      - alert: WalletScanLag
        expr: wallet_scan_block_lag > 24
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: Deposit scanner is behind the chain head
          runbook_url: docs/runbooks/incident-response.md#scan-lag
      - alert: WalletRpcErrorRate
        expr: rate(wallet_rpc_errors_total[5m]) / clamp_min(rate(wallet_rpc_requests_total[5m]), 1) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: RPC error ratio is above 5 percent
      - alert: WalletMonitoringCollectionFailure
        expr: increase(wallet_monitoring_collection_errors_total[5m]) > 0
        labels: { severity: warning }
        annotations:
          summary: Operational metric collection is failing

