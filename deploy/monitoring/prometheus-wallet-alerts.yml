groups:
  - name: wallet-critical
    rules:
      - alert: WalletApplicationDown
        expr: up{job="web3-wallet-backend"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: Wallet backend is unavailable
          runbook_url: deploy/monitoring/wallet-incident-response.md#application-down
      - alert: WalletLedgerAnomaly
        expr: wallet_ledger_anomalies > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: Internal ledger invariant violation detected
          runbook_url: deploy/monitoring/wallet-incident-response.md#ledger-or-reconciliation-difference
      - alert: WalletReconciliationDifference
        expr: wallet_reconciliation_differences > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: Wallet reconciliation has open differences
          runbook_url: docs/runbooks/incident-response.md#ledger-or-reconciliation-difference
      - alert: WalletOutboxBacklog
        expr: wallet_outbox_backlog > 20
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: Withdrawal broadcast outbox is accumulating
          runbook_url: deploy/monitoring/wallet-incident-response.md#outbox-backlog
      - alert: WalletPendingWithdrawals
        expr: wallet_withdraw_pending > 20
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: Pending withdrawals exceed the operational threshold
      - alert: WalletNonceGap
        expr: wallet_nonce_gap > 3
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: Hot-wallet nonce gap is unsafe
          runbook_url: deploy/monitoring/wallet-incident-response.md#nonce-anomaly
      - alert: WalletScanLag
        expr: wallet_scan_block_lag > 24
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: Deposit scanner is behind the chain head
          runbook_url: deploy/monitoring/wallet-incident-response.md#scan-lag
      - alert: WalletRpcErrorRate
        expr: rate(wallet_rpc_errors_total[5m]) / clamp_min(rate(wallet_rpc_requests_total[5m]), 1) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: RPC error ratio is above 5 percent
      - alert: WalletRpcBlockHashQuorumMismatch
        expr: increase(wallet_rpc_block_hash_quorum_mismatches_total[5m]) > 0
        labels: { severity: critical }
        annotations:
          summary: Independent RPC providers disagree on a canonical block hash
          runbook_url: deploy/monitoring/wallet-incident-response.md#rpc-block-hash-quorum-failure
      - alert: WalletRpcBlockHashQuorumError
        expr: increase(wallet_rpc_block_hash_quorum_errors_total[5m]) > 0
        labels: { severity: critical }
        annotations:
          summary: Secondary RPC cannot verify deposit block hashes
          runbook_url: deploy/monitoring/wallet-incident-response.md#rpc-block-hash-quorum-failure
      - alert: WalletRpcReceiptQuorumMismatch
        expr: increase(wallet_rpc_receipt_quorum_mismatches_total[5m]) > 0
        labels: { severity: critical }
        annotations:
          summary: Independent RPC providers disagree on a transaction receipt
          runbook_url: deploy/monitoring/wallet-incident-response.md#rpc-receipt-quorum-failure
      - alert: WalletRpcReceiptQuorumError
        expr: increase(wallet_rpc_receipt_quorum_errors_total[5m]) > 0
        labels: { severity: critical }
        annotations:
          summary: Secondary RPC cannot verify transaction receipts
          runbook_url: deploy/monitoring/wallet-incident-response.md#rpc-receipt-quorum-failure
      - alert: WalletRpcNonceQuorumMismatch
        expr: increase(wallet_rpc_nonce_pending_quorum_mismatches_total[5m]) + increase(wallet_rpc_nonce_latest_quorum_mismatches_total[5m]) > 0
        labels: { severity: critical }
        annotations:
          summary: Independent RPC providers disagree on a hot-wallet nonce
          runbook_url: deploy/monitoring/wallet-incident-response.md#rpc-nonce-quorum-failure
      - alert: WalletRpcNonceQuorumError
        expr: increase(wallet_rpc_nonce_pending_quorum_errors_total[5m]) + increase(wallet_rpc_nonce_latest_quorum_errors_total[5m]) > 0
        labels: { severity: critical }
        annotations:
          summary: Secondary RPC cannot verify a hot-wallet nonce
          runbook_url: deploy/monitoring/wallet-incident-response.md#rpc-nonce-quorum-failure
      - alert: WalletRpcTransactionQuorumMismatch
        expr: increase(wallet_rpc_transaction_quorum_mismatches_total[5m]) > 0
        labels: { severity: critical }
        annotations:
          summary: Independent RPC providers disagree on transaction presence
          runbook_url: deploy/monitoring/wallet-incident-response.md#rpc-transaction-quorum-failure
      - alert: WalletRpcTransactionQuorumError
        expr: increase(wallet_rpc_transaction_quorum_errors_total[5m]) > 0
        labels: { severity: critical }
        annotations:
          summary: Secondary RPC cannot verify transaction presence
          runbook_url: deploy/monitoring/wallet-incident-response.md#rpc-transaction-quorum-failure
      - alert: WalletRpcBalanceQuorumMismatch
        expr: increase(wallet_rpc_balance_native_quorum_mismatches_total[5m]) + increase(wallet_rpc_balance_erc20_quorum_mismatches_total[5m]) > 0
        labels: { severity: critical }
        annotations:
          summary: Independent RPC providers disagree on an asset balance
          runbook_url: deploy/monitoring/wallet-incident-response.md#rpc-balance-quorum-failure
      - alert: WalletRpcBalanceQuorumError
        expr: increase(wallet_rpc_balance_native_quorum_errors_total[5m]) + increase(wallet_rpc_balance_erc20_quorum_errors_total[5m]) > 0
        labels: { severity: critical }
        annotations:
          summary: Secondary RPC cannot verify an asset balance
          runbook_url: deploy/monitoring/wallet-incident-response.md#rpc-balance-quorum-failure
      - alert: WalletRpcHeadQuorumMismatch
        expr: increase(wallet_rpc_head_quorum_mismatches_total[5m]) > 0
        labels: { severity: critical }
        annotations:
          summary: Independent RPC chain heads exceed the permitted lag
          runbook_url: deploy/monitoring/wallet-incident-response.md#rpc-chain-head-quorum-failure
      - alert: WalletRpcHeadQuorumError
        expr: increase(wallet_rpc_head_quorum_errors_total[5m]) > 0
        labels: { severity: critical }
        annotations:
          summary: Secondary RPC cannot verify the current chain head
          runbook_url: deploy/monitoring/wallet-incident-response.md#rpc-chain-head-quorum-failure
      - alert: WalletRpcFeeQuorumMismatch
        expr: increase(wallet_rpc_fee_quorum_mismatches_total[5m]) > 0
        labels: { severity: critical }
        annotations:
          summary: Independent RPC providers disagree on the canonical EIP-1559 base fee
          runbook_url: deploy/monitoring/wallet-incident-response.md#rpc-fee-and-gas-quorum-failure
      - alert: WalletRpcFeeQuorumError
        expr: increase(wallet_rpc_fee_quorum_errors_total[5m]) > 0
        labels: { severity: critical }
        annotations:
          summary: Secondary RPC cannot verify EIP-1559 fee inputs
          runbook_url: deploy/monitoring/wallet-incident-response.md#rpc-fee-and-gas-quorum-failure
      - alert: WalletRpcGasEstimateQuorumError
        expr: increase(wallet_rpc_gas_estimate_quorum_errors_total[5m]) > 0
        labels: { severity: critical }
        annotations:
          summary: Secondary RPC cannot provide a valid gas estimate
          runbook_url: deploy/monitoring/wallet-incident-response.md#rpc-fee-and-gas-quorum-failure
      - alert: WalletMonitoringCollectionFailure
        expr: increase(wallet_monitoring_collection_errors_total[5m]) > 0
        labels: { severity: warning }
        annotations:
          summary: Operational metric collection is failing
