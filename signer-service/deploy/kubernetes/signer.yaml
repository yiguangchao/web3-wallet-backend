apiVersion: v1
kind: ServiceAccount
metadata:
  name: wallet-signer
  annotations:
    iam.gke.io/gcp-service-account: wallet-signer@PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-signer
spec:
  replicas: 2
  selector:
    matchLabels: { app: wallet-signer }
  template:
    metadata:
      labels: { app: wallet-signer }
    spec:
      serviceAccountName: wallet-signer
      automountServiceAccountToken: true
      containers:
        - name: signer
          image: REGISTRY/wallet-signer@sha256:REPLACE_ME
          ports:
            - { name: https, containerPort: 8443 }
          envFrom:
            - secretRef: { name: wallet-signer-runtime }
          volumeMounts:
            - { name: mtls, mountPath: /var/run/signer-tls, readOnly: true }
          readinessProbe:
            tcpSocket: { port: https }
            initialDelaySeconds: 20
          livenessProbe:
            tcpSocket: { port: https }
            initialDelaySeconds: 40
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: mtls
          secret: { secretName: wallet-signer-mtls }
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-signer
spec:
  selector: { app: wallet-signer }
  ports:
    - { name: https, port: 443, targetPort: https }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wallet-signer-isolation
spec:
  podSelector:
    matchLabels: { app: wallet-signer }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: web3-wallet-backend }
      ports:
        - { protocol: TCP, port: 8443 }
  egress:
    - to: []
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 3306 }
